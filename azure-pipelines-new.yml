trigger:
  branches:
    include:
      - azure-pipelines-new

pool:
  vmImage: 'ubuntu-latest'

variables:
  imageName: azure-vote-front
  dockerfilePath: azure-vote/Dockerfile

stages:
- stage: Build
  displayName: 'Build and Push Image'
  jobs:
    - job: Build
      steps:
        - task: Docker@2
          displayName: 'Login to ACR'
          inputs:
            command: login
            containerRegistry: 'crlbgvoteapptestuksa'  # <-- update this

        - task: Docker@2
          displayName: 'Build and Push Image'
          inputs:
            command: buildAndPush
            repository: $(imageName)
            dockerfile: $(dockerfilePath)
            containerRegistry: 'crlbgvoteapptestuksa'
            tags: |
              $(Build.BuildId)
